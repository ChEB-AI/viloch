[project]
name = "viloch"
version = "0.1.0"
description = "Visualise chemical logic rules: local/global explanations and a graphical ASP rule editor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    # chebILP core: molecule -> ASP facts, functional-group seeds, aux rule library loading.
    # Pinned to the explanation rewrite (feature/better-chebi-explanations) until released.
    "chebilp @ git+https://github.com/ChEB-AI/chebILP@802ccbc52870da55a8f0a3e1d530e5d8a9279043",
    "chebi-utils>=0.4",
    "clingo>=5.8.0",
    "xclingo>=2.0b24",
    "networkx>=3.6.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "rdkit>=2025.9.6",
    "Pillow>=12.1.1",
    "matplotlib>=3.8",  # only for its bundled DejaVu fonts
]

[project.optional-dependencies]
web = [
    "starlette>=1.1.0",
    "uvicorn>=0.48.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",  # starlette TestClient
    "jsonschema>=4.23",
    "ruff>=0.14",
    "pre-commit>=4",
]
e2e = [
    "playwright>=1.48",
    "pytest-playwright>=0.6",
]

[project.scripts]
viloch = "viloch.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["viloch*"]

[tool.setuptools.package-data]
viloch = ["resources/*.tsv", "editor/*.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: explanation rendering tests (seconds each)",
    "e2e: browser tests against `viloch serve` (needs the e2e extra and playwright browsers)",
    "snapshot: pixel regression of rendered explanations (local only; fonts/cairo vary)",
]
addopts = "-m 'not e2e and not snapshot'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]


[tool.ruff.lint]
# Explicit, so the rule set does not change with the ruff version.
select = ["E4", "E7", "E9", "F", "I"]
